
{% extends 'base.html' %}

{% block title %}Login | Asia Plus{% endblock %}

{% block content %}

<div class="form-box">
    <h2>Welcome Back</h2>

    <p style="text-align:center;color:#777;margin-bottom:25px;">
        Login to your Asia Plus account.
    </p>

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button class="btn" type="submit">Login</button>
    </form>

    <p style="text-align:center;margin-top:20px;color:#777;">
        Don't have an account?
        <a href="{% url 'register' %}" style="color:#e63946;">Register</a>
    </p>
</div>

{% endblock %}

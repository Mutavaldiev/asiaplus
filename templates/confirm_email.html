{% extends 'base.html' %}
{% block title %}Verify Email | Asia Plus{% endblock %}
{% block content %}
<div class="form-box">
    <h2>Verify Your Email</h2>
    <p style="text-align:center;color:#777;margin-bottom:25px;">
        Enter your username and the verification code sent to your email.
    </p>
    <form method="POST">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" placeholder="Your username" required>

        <label>Verification Code</label>
        <input type="text" name="code" placeholder="Enter 6-digit code"
               maxlength="6" required>

        <button class="btn" type="submit">Verify Account</button>
    </form>
</div>

{% endblock %}
